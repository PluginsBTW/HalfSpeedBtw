[package]
name = "halfspeedbtw"
description = "HalfSpeedBtw half-speed loop effect (CLAP/VST3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[features]
# Builds a standalone app (JACK or a dummy backend) for iterating on the GUI without a DAW:
# `cargo run -p halfspeedbtw --features standalone -- --backend dummy`
standalone = ["nice-plug/standalone"]

[[bin]]
name = "halfspeedbtw"
required-features = ["standalone"]

[dependencies]
btw-ui = { path = "../btw-ui" }
halfspeed-dsp = { path = "../halfspeed-dsp" }
# `assert_process_allocs` aborts debug builds that allocate inside `process()`.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
# wgpu (Vulkan) instead of the default OpenGL renderer: baseview's EGL setup segfaults on
# NVIDIA's proprietary driver because it lets the driver guess the display platform.
nice-plug-egui = { version = "0.6.0", default-features = false, features = ["wgpu"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
atomic_float = "1.1"
