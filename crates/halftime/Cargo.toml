[package]
name = "halftime"
description = "HalfTime half-speed loop effect (CLAP/VST3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
halftime-dsp = { path = "../halftime-dsp" }
# `assert_process_allocs` aborts debug builds that allocate inside `process()`.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.6.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
atomic_float = "1.1"
